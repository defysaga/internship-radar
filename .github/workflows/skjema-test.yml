# Midlertidig: prøver hvordan tilbakemeldingsskjemaet tar imot svar fra appen.
name: Test av tilbakemeldingsskjema
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prøv innsending
        run: |
          cat > t.mjs <<'JS'
          const ID = "1FAIpQLSdqg9jPsc4DLP3JEFJ0uZp00sJO6dvQOrB73oDXWdErTZWerA";
          const base = "https://docs.google.com/forms/d/e/" + ID;
          const n = (m) => console.log("::notice title=Skjema::" + m);
          const vf = await fetch(base + "/viewform");
          const html = await vf.text();
          const fbzx = (html.match(/name="fbzx" value="([^"]+)"/) || [])[1] || "";
          n("viewform " + vf.status + " fbzx " + (fbzx ? "funnet" : "mangler") + " | action: " + ((html.match(/<form[^>]+action="([^"]+)"/) || [])[1] || "?"));
          const felt = (v) => ({ "entry.199714724": "Test", "entry.1517633948": "Test fra oppsettet av Radar (" + v + ", kan slettes)", "entry.1995560602": "variant " + v });
          const svar = async (navn, url, opts) => {
            const r = await fetch(url, opts);
            const t = await r.text();
            const ok = /freebirdFormviewerViewResponseConfirmationMessage|vtv4|Your response has been recorded|Svaret ditt er registrert|registrert/i.test(t);
            n(navn + " " + r.status + (ok ? " REGISTRERT" : " " + t.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, " ").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").slice(0, 160)));
          };
          const enc = (o) => new URLSearchParams(o);
          const cookies = (vf.headers.getSetCookie ? vf.headers.getSetCookie() : []).map((c) => c.split(";")[0]).join("; ");
          n("cookies fra viewform: " + (cookies ? cookies.split("; ").map((c) => c.split("=")[0]).join(",") : "ingen"));
          const full = (v, z) => enc({ ...felt(v), fvv: "1", partialResponse: JSON.stringify([null, null, z]), pageHistory: "0", fbzx: z, submissionTimestamp: String(Date.now()) });
          const H = { "Content-Type": "application/x-www-form-urlencoded", "Origin": "https://docs.google.com", "Referer": base + "/viewform" };
          await svar("E full, uten cookies", base + "/formResponse", { method: "POST", body: full("E", fbzx), headers: H });
          await svar("F full, med cookies", base + "/formResponse", { method: "POST", body: full("F", fbzx), headers: { ...H, Cookie: cookies } });
          await svar("G full, tilfeldig fbzx", base + "/formResponse", { method: "POST", body: full("G", "-" + String(Math.floor(Math.random() * 1e18))), headers: H });
          const r2 = await fetch(base + "/viewform");
          n("viewform igjen " + r2.status + " " + r2.url.slice(0, 120));
          JS
          node t.mjs
