# Midlertidig: sjekker at synk-serveren svarer fra nettet (slettes når den er bekreftet)
name: Synk-sjekk
on:
  push:
    paths: [".github/workflows/synk-sjekk.yml"]
  workflow_dispatch:
jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - name: Test synk-serveren
        run: |
          B=https://radar-synk.mads-lunde-sorensen.workers.dev
          O="Origin: https://defysaga.github.io"
          s=$(curl -s -o /tmp/s -w "%{http_code}" -H "$O" $B/v1/status); echo "::notice title=status::$s $(head -c 200 /tmp/s)"
          s=$(curl -s -o /dev/null -D /tmp/h -w "%{http_code}" -X OPTIONS -H "$O" -H "Access-Control-Request-Method: PUT" -H "Access-Control-Request-Headers: content-type" $B/v1/kopi/$(printf 'f%.0s' {1..64})); echo "::notice title=options::$s $(grep -i 'access-control-allow-origin' /tmp/h | tr -d '\r')"
          ID=$(head -c 32 /dev/urandom | sha256sum | cut -c1-64); T=$(head -c 32 /dev/urandom | sha256sum | cut -c1-64)
          s=$(curl -s -o /tmp/p -w "%{http_code}" -X PUT -H "$O" -H "Content-Type: application/json" -d "{\"data\":\"test\",\"token\":\"$T\",\"versjon\":0}" $B/v1/kopi/$ID); echo "::notice title=put::$s $(head -c 200 /tmp/p)"
          s=$(curl -s -o /tmp/g -w "%{http_code}" -H "$O" $B/v1/kopi/$ID); echo "::notice title=get::$s $(head -c 200 /tmp/g)"
          s=$(curl -s -o /tmp/d -w "%{http_code}" -X DELETE -H "$O" -H "Content-Type: application/json" -d "{\"token\":\"$T\"}" $B/v1/kopi/$ID); echo "::notice title=delete::$s $(head -c 200 /tmp/d)"
          s=$(curl -s -o /dev/null -w "%{http_code}" https://defysaga.github.io/internship-radar/vendor/pdfjs/pdf.min.mjs); echo "::notice title=pdfjs::$s"
          v=$(curl -s https://defysaga.github.io/internship-radar/sw.js | grep -o 'radar-v[0-9]*' | head -1); echo "::notice title=pages::$v"
          c=$(curl -s https://defysaga.github.io/internship-radar/config.js | grep -c synkUrl); echo "::notice title=config::synkUrl $c"
