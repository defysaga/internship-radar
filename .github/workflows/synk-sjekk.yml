# Midlertidig: sjekker at tilbakemeldinger kommer fram til synk-serveren (slettes etterpå)
name: Synk-sjekk
on:
  push:
    paths: [".github/workflows/synk-sjekk.yml"]
jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - name: Send en test-tilbakemelding (venter til den nye serveren er ute)
        run: |
          B=https://radar-synk.mads-lunde-sorensen.workers.dev
          for i in $(seq 1 30); do
            s=$(curl -s -o /tmp/p -w "%{http_code}" -X POST -H "Origin: https://defysaga.github.io" -H "Content-Type: application/json" -d '{"type":"test","tekst":"TEST fra GitHub (slettes)","info":"sjekk"}' $B/v1/tilbakemelding)
            if [ "$s" = "200" ]; then break; fi
            sleep 20
          done
          echo "::notice title=tilbakemelding::$s $(head -c 200 /tmp/p) etter $i forsøk"
          s=$(curl -s -o /dev/null -D /tmp/h -w "%{http_code}" -X OPTIONS -H "Origin: https://defysaga.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" $B/v1/tilbakemelding); echo "::notice title=options::$s $(grep -i 'access-control-allow-methods' /tmp/h | tr -d '\r')"
